# Pushing a tag like v0.2.0-rc builds picky for every platform and publishes a GitHub release with
# the binaries and their SHA256SUMS, which `picky init` downloads and checks. A tag with a
# pre-release suffix (-rc, -beta) is marked as a pre-release.
name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - { platform: linux-x64, os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { platform: linux-arm64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { platform: darwin-x64, os: macos-latest, target: x86_64-apple-darwin, cross: true }
          - { platform: darwin-arm64, os: macos-latest, target: aarch64-apple-darwin }
          # A static C runtime, so the binary needs no Visual C++ redistributable.
          - { platform: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc, exe: .exe, rustflags: -C target-feature=+crt-static }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches Cargo.toml
        shell: bash
        run: test "v$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)" = "$GITHUB_REF_NAME"
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -yq musl-tools
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }} && rustup default stable
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - if: ${{ !matrix.cross }}
        run: cargo test --locked
      - name: Build
        env:
          PICKY_RELEASE_PLATFORM: ${{ matrix.platform }}
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Name it for the release
        shell: bash
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/picky${{ matrix.exe }}" "dist/picky-${{ matrix.platform }}${{ matrix.exe }}"
      - if: ${{ !matrix.cross }}
        shell: bash
        run: test "$("dist/picky-${{ matrix.platform }}${{ matrix.exe }}" --version)" = "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v7
        with:
          name: picky-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: picky-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          test "$(ls | wc -l)" -eq 5
          sha256sum picky-* > SHA256SUMS
          cat SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""; case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md $pre
