# Pushing a tag like v0.1.0-rc builds the bundle and publishes a GitHub release with its checksum.
# A tag with a pre-release suffix (-rc, -beta) is marked as a pre-release.
name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Bun runs the tooling. Node runs what users run: the CLI under test and the bundle.
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: package.json }
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - name: Check the tag matches package.json
        run: test "v$(bun -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Checksum
        working-directory: dist
        run: sha256sum picky.mjs > picky.mjs.sha256
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""; case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/picky.mjs dist/picky.mjs.sha256 --title "$GITHUB_REF_NAME" --notes-file notes.md $pre
